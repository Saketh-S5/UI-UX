<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image slider</title>
</head>
<body>
<h2>Image Slider</h2>
<img id="image" src="image1.jpg">
<br><br>
<button onclick="previous()">Previous</button>
<button onclick="next()">next</button>
<script>
    let images=["image1.jpg","image3.png","image4.png"];
    let i=0;
    function next(){
        i++;
        if(i==images.length){
            i==0;
        }
        document.getElementById("image").src=images[i]; 
    }
function previous(){
    i--;
    if(i<0){
        i=images.length-1;
    }
    document.getElementById("image").src=images[i];
}
setInterval(next,30);
</script>
</body>
</html>
